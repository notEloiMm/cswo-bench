[project]
name = "cswo"
version = "0.1.0"
description = "CSWO-Bench: a multilingual multimodal benchmark of citizen science water observations"
readme = "README.md"
license = "MIT"
authors = [
    { name = "eloi.mas.marti", email = "eloi.mas.marti@estudiantat.upc.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "ca-core-news-sm",
    "da-core-news-sm",
    "de-core-news-sm",
    "en-core-web-sm",
    "es-core-news-sm",
    "fi-core-news-sm",
    "fr-core-news-sm",
    "hr-core-news-sm",
    "it-core-news-sm",
    "lingua-language-detector>=2.1.1",
    "lt-core-news-sm",
    "matplotlib>=3.11.2",
    "nb-core-news-sm",
    "nl-core-news-sm",
    "nltk>=3.10.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pl-core-news-sm",
    "preshed==3.0.10",  # 3.0.14 breaks spaCy model loading on Windows (OverflowError in tokenizer)
    "protobuf>=7.36.2",
    "pt-core-news-sm",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "reverse-geocoder>=1.5.1",
    "ro-core-news-sm",
    "ru-core-news-sm",
    "scikit-learn>=1.6.0",
    "sentencepiece>=0.2.2",
    "simplemma>=2.0.0",
    "sl-core-news-sm",
    "spacy>=3.8.16",
    "statsmodels>=0.15.0",
    "sv-core-news-sm",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "xx-ent-wiki-sm",
]

[project.scripts]
cswo = "cswo.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
